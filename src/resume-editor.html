<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Editor</title>
  <style>
    :root {
      color: #1e293b;
      background: #e7e4dd;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body { margin: 0; min-width: 320px; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      background: #153c35;
      color: #f8f6ef;
    }

    h1 { margin: 0; font-family: Georgia, serif; font-size: 21px; font-weight: 600; }

    .subtitle { margin: 2px 0 0; color: #c8d8cf; font-size: 12px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .header-separator { align-self: stretch; border-left: 1px solid #6d9186; }
    .header-actions > .action-button:hover { background: #fff; color: #153c35; }
    .view-controls { display: flex; gap: 6px; }
    .view-controls button { border-color: #6d9186; background: transparent; font-size: 12px; font-weight: 600; }
    .view-controls button:hover, .view-controls button[aria-pressed="true"] { background: #f8f6ef; color: #153c35; }

    main {
      display: grid;
      grid-template-columns: minmax(320px, 0.9fr) minmax(440px, 1.1fr);
      height: calc(100vh - 70px);
      min-height: 560px;
    }

    .editor, .preview { min-width: 0; padding: 16px 18px; }
    .editor { display: flex; flex-direction: column; background: #f8f6ef; border-right: 1px solid #c9c4ba; }
    .preview { display: flex; flex-direction: column; background: #d8d4cc; }
    main.editor-only, main.preview-only { grid-template-columns: 1fr; }
    main.editor-only .preview, main.preview-only .editor { display: none; }

    .controls { display: flex; align-items: end; gap: 8px; margin-bottom: 12px; }
    .font-control { display: grid; gap: 3px; }
    label, .panel-label { color: #52635e; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    select, button { border-radius: 4px; font: inherit; }
    select { min-width: 170px; padding: 7px 9px; border: 1px solid #9ba7a1; background: #fff; color: #17221f; }
    .backup-control select { min-width: 215px; }
    input[type="file"] { display: none; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 12px; border: 1px solid #0b2e27; background: #153c35; color: #fff; cursor: pointer; font-weight: 700; }
    button:hover { background: #0b2e27; }
    button:disabled { cursor: wait; opacity: 0.7; }
    .button-icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .icon-button { width: 35px; padding: 8px; }
    .markdown-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 9px; }
    .markdown-toolbar .panel-label { margin: 0; }
    .markdown-actions { display: flex; gap: 6px; }
    .markdown-actions button { border-color: #9ba7a1; background: #fff; color: #153c35; }
    .markdown-actions button:hover { border-color: #153c35; background: #e6f0ea; }

    .formatting-dialog {
      width: min(360px, calc(100vw - 32px));
      padding: 20px;
      border: 1px solid #9ba7a1;
      border-radius: 6px;
      color: #1e293b;
      background: #f8f6ef;
      box-shadow: 0 12px 32px #17221f66;
    }
    .formatting-dialog::backdrop { background: #153c3570; }
    .formatting-dialog h2 { margin: 0 0 18px; font: 600 21px Georgia, serif; }
    .formatting-options { display: grid; gap: 14px; }
    .dialog-actions { display: flex; justify-content: end; margin: 20px 0 0; padding: 0; }

    #status { min-height: 18px; margin: 0 0 9px; color: #52635e; font-size: 13px; }
    #status.error { color: #a32929; }

    textarea {
      width: 100%;
      min-height: 0;
      flex: 1;
      resize: none;
      padding: 14px;
      border: 1px solid #9ba7a1;
      border-radius: 4px;
      outline: none;
      background: #fff;
      color: #17221f;
      font: 13px/1.45 "SFMono-Regular", Consolas, monospace;
      tab-size: 2;
    }

    textarea:focus, select:focus { border-color: #153c35; box-shadow: 0 0 0 2px #bad4c8; }
    .preview-title { margin: 0 0 9px; }
    iframe { width: 100%; min-height: 0; flex: 1; border: 1px solid #aaa69e; background: #fff; box-shadow: 0 2px 10px #5a565040; }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; height: auto; }
      .editor, .preview { min-height: 620px; }
      .editor { border-right: 0; border-bottom: 1px solid #c9c4ba; }
      iframe { min-height: 700px; }
    }

    @media (max-width: 540px) {
      header { align-items: flex-start; flex-direction: column; }
      .header-actions { width: 100%; }
      .header-actions > button { width: auto; }
      .view-controls { flex: 1; }
      .view-controls button { flex: 1; padding: 8px 4px; }
      .controls { align-items: end; }
      select, button { width: 100%; }
      .icon-button { width: 35px; }
      .markdown-toolbar { align-items: flex-start; flex-direction: column; }
      .markdown-actions { width: 100%; }
      .markdown-actions button { flex: 1; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Resume Editor</h1>
      <p class="subtitle">Local Markdown source, standards-focused PDF output.</p>
    </div>
    <div class="header-actions">
      <button id="render" class="action-button" type="button">
        <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 1-2.34-5.66L20 8"></path><path d="M20 4v4h-4"></path></svg>
        <span>Regenerate PDF</span>
      </button>
      <button id="formatting" class="action-button" type="button" aria-haspopup="dialog">
        <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10"></path><path d="M18 7h2"></path><path d="M4 17h4"></path><path d="M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
        <span>Formatting</span>
      </button>
      <div class="header-separator" aria-hidden="true"></div>
      <div class="view-controls" aria-label="Editor layout">
        <button type="button" data-view="split" aria-pressed="true">Split</button>
        <button type="button" data-view="editor-only" aria-pressed="false">Markdown</button>
        <button type="button" data-view="preview-only" aria-pressed="false">PDF</button>
      </div>
    </div>
  </header>
  <main>
    <section class="editor" aria-label="Markdown editor">
      <div class="controls">
        <div class="font-control backup-control">
          <label for="backup">Recent backups</label>
          <select id="backup">
            <option value="">No backups yet</option>
          </select>
        </div>
        <button id="load-backup" class="icon-button" type="button" aria-label="Load selected backup" title="Load selected backup">
          <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path><path d="M12 7v5l3 2"></path></svg>
        </button>
      </div>
      <p id="status" role="status">Loading resume source...</p>
      <div class="markdown-toolbar">
        <p class="panel-label">Markdown source</p>
        <div class="markdown-actions">
          <button id="load-file" type="button">
            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9"></path><path d="m7 14 5-5 5 5"></path><path d="M5 4h14"></path></svg>
            <span>Load Markdown</span>
          </button>
          <input id="file-input" type="file" accept="text/markdown,.md,.markdown">
          <button id="export" type="button">
            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 20h14"></path></svg>
            <span>Save Markdown</span>
          </button>
        </div>
      </div>
      <textarea id="markdown" aria-label="Resume Markdown" spellcheck="true"></textarea>
    </section>
    <section class="preview" aria-label="PDF preview">
      <p class="panel-label preview-title">PDF preview</p>
      <iframe id="pdf" title="Generated resume PDF"></iframe>
    </section>
  </main>
  <dialog id="formatting-dialog" class="formatting-dialog" aria-labelledby="formatting-title">
    <h2 id="formatting-title">Resume formatting</h2>
    <div class="formatting-options">
      <div class="font-control">
        <label for="font">Resume font</label>
        <select id="font">
          <option value="Cambria">Cambria</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Georgia">Georgia</option>
          <option value="Garamond">Garamond</option>
          <option value="Calibri">Calibri</option>
          <option value="Arial">Arial</option>
        </select>
      </div>
      <div class="font-control">
        <label for="margin">Page margins</label>
        <select id="margin">
          <option value="0.5">0.5 inches</option>
          <option value="0.75">0.75 inches</option>
          <option value="1">1 inch</option>
        </select>
      </div>
    </div>
    <form id="formatting-form" method="dialog" class="dialog-actions">
      <button type="submit">Done</button>
    </form>
  </dialog>
  <script>
    const markdown = document.querySelector('#markdown');
    const font = document.querySelector('#font');
    const margin = document.querySelector('#margin');
    const backup = document.querySelector('#backup');
    const loadBackup = document.querySelector('#load-backup');
    const loadFile = document.querySelector('#load-file');
    const fileInput = document.querySelector('#file-input');
    const exportMarkdown = document.querySelector('#export');
    const formatting = document.querySelector('#formatting');
    const formattingDialog = document.querySelector('#formatting-dialog');
    const formattingForm = document.querySelector('#formatting-form');
    const render = document.querySelector('#render');
    const status = document.querySelector('#status');
    const pdf = document.querySelector('#pdf');
    const workspace = document.querySelector('main');
    const viewButtons = document.querySelectorAll('[data-view]');

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }

    function refreshPdf() {
      pdf.src = `local-resumes/resume.pdf?updated=${Date.now()}#view=FitH`;
    }

    function setBackups(backups) {
      const selected = backup.value;
      backup.replaceChildren(new Option(backups.length ? 'Select a backup' : 'No backups yet', ''));
      backups.forEach(item => backup.add(new Option(item.label, item.name)));
      backup.value = backups.some(item => item.name === selected) ? selected : '';
    }

    async function refreshBackups() {
      const response = await fetch('/api/backups');
      if (!response.ok) throw new Error('Could not load recent backups.');
      const data = await response.json();
      setBackups(data.backups);
    }

    async function saveCurrentMarkdown() {
      const response = await fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ markdown: markdown.value })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Could not save the Markdown.');
      setBackups(data.backups);
      return data;
    }

    viewButtons.forEach(button => {
      button.addEventListener('click', () => {
        workspace.classList.remove('editor-only', 'preview-only');
        if (button.dataset.view !== 'split') workspace.classList.add(button.dataset.view);
        viewButtons.forEach(item => item.setAttribute('aria-pressed', item === button));
      });
    });

    formatting.addEventListener('click', () => formattingDialog.showModal());
    formattingForm.addEventListener('submit', event => {
      event.preventDefault();
      formattingDialog.close();
      renderPdf();
    });

    async function loadResume() {
      const response = await fetch('/api/resume');
      if (!response.ok) throw new Error('Could not load the resume source.');
      const data = await response.json();
      markdown.value = data.markdown;
      font.value = data.font;
      margin.value = data.margin;
      refreshPdf();
      await refreshBackups();
      setStatus('Ready. Edit the Markdown, choose a font, then regenerate.');
    }

    async function renderPdf() {
      render.disabled = true;
      setStatus('Rendering PDF...');
      try {
        const response = await fetch('/api/render', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ markdown: markdown.value, font: font.value, margin: margin.value })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'PDF rendering failed.');
        refreshPdf();
        setBackups(data.backups);
        setStatus('PDF regenerated successfully.');
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        render.disabled = false;
      }
    }

    render.addEventListener('click', renderPdf);

    loadBackup.addEventListener('click', async () => {
      if (!backup.value) {
        setStatus('Choose a backup to load.', true);
        return;
      }
      try {
        await saveCurrentMarkdown();
        const response = await fetch('/api/load-backup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ backup: backup.value })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Could not load the backup.');
        markdown.value = data.markdown;
        setBackups(data.backups);
        await renderPdf();
      } catch (error) {
        setStatus(error.message, true);
      }
    });

    loadFile.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
      const [file] = fileInput.files;
      if (!file) return;
      try {
        markdown.value = await file.text();
        await saveCurrentMarkdown();
        setStatus('Markdown file loaded into the editor and saved locally. Regenerate the PDF to apply it.');
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        fileInput.value = '';
      }
    });

    exportMarkdown.addEventListener('click', async () => {
      try {
        const supportsSavePicker = typeof window.showSaveFilePicker === 'function';
        const fileHandle = supportsSavePicker ? await window.showSaveFilePicker({
          suggestedName: 'resume.md',
          types: [{
            description: 'Markdown files',
            accept: { 'text/markdown': ['.md', '.markdown'] }
          }]
        }) : null;
        const data = await saveCurrentMarkdown();
        if (fileHandle) {
          const writable = await fileHandle.createWritable();
          await writable.write(data.markdown);
          await writable.close();
          setStatus('Markdown saved locally and to the selected file.');
        } else {
          const blob = new Blob([data.markdown], { type: 'text/markdown;charset=utf-8' });
          const link = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'resume.md' });
          link.click();
          URL.revokeObjectURL(link.href);
          setStatus('Markdown saved locally and downloaded as resume.md.');
        }
      } catch (error) {
        if (error.name === 'AbortError') return;
        setStatus(error.message, true);
      }
    });

    loadResume().catch(error => setStatus(error.message, true));
  </script>
</body>
</html>
